<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orlando phone journeys — review prototype</title>
<style>
:root{font-family:Arial,sans-serif;color:#25231e;background:#e7e1d4;--ink:#25231e;--paper:#f8f4e8;--hot:#a73421;--gold:#f2ca69;--line:#c9c0ac}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #30647b;outline-offset:2px}.shell{max-width:560px;min-height:100vh;margin:auto;background:var(--paper);padding:0 18px 156px}.prototype{background:#292720;color:#fdf6de;font-size:12px;line-height:1.4;padding:9px 14px;margin:0 -18px}.prototype strong{color:#f1d27e}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0 14px;border-bottom:2px solid var(--ink)}.brand{font-family:Georgia,serif;font-weight:900;font-size:25px;letter-spacing:-1.4px;line-height:.87}.brand small{display:block;font:700 10px Arial;letter-spacing:2px;margin-top:7px}.day{font-size:11px;letter-spacing:1px;font-weight:800;text-align:right}.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto}.nav button{border:0;background:none;padding:16px 8px 13px;font-weight:700;white-space:nowrap;color:#5a554a}.nav button[aria-current=page]{color:var(--hot);box-shadow:inset 0 -3px var(--hot)}h1,h2,h3,p{margin:0}h1{font:900 42px/0.95 Georgia,serif;letter-spacing:-1.6px}h2{font:800 25px/1.05 Georgia,serif;letter-spacing:-.6px}h3{font-size:16px}.eyebrow{font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:10px;color:var(--hot)}.lead{line-height:1.5;color:#575146;font-size:14px}.intro{padding:27px 0 18px;display:grid;gap:10px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:20px 0 10px;gap:10px}.tiny{font-size:12px;line-height:1.45;color:#625b4c}.list{border-top:2px solid var(--ink)}.row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.rowmain{flex:1;min-width:0}.row h3{font-size:18px;margin:3px 0}.row .meta{font-size:12px;color:#60594d;line-height:1.45}.save{width:44px;height:44px;flex:none;border:1.5px solid var(--ink);background:transparent;font-size:25px;line-height:1}.save.on{color:#fff7e7;background:var(--hot);border-color:var(--hot)}.pill{display:inline-block;padding:5px 8px;border:1px solid var(--line);font-size:11px;font-weight:700}.button{border:1.5px solid var(--ink);background:transparent;padding:11px 13px;font-weight:700;font-size:13px;min-height:44px}.button.primary{background:var(--ink);color:var(--paper)}.button.red{background:var(--hot);border-color:var(--hot);color:#fff8e8}.button:disabled{opacity:.45;cursor:not-allowed}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{background:#f3dfb5;padding:14px;margin:14px 0;font-size:13px;line-height:1.45}.notice strong{display:block;font-size:14px;margin-bottom:3px}.alert{background:#f2d6c6}.good{background:#dce8d2}.box{border:1px solid var(--line);padding:15px;margin:12px 0}.box h3{margin-bottom:6px}.box p{font-size:13px;line-height:1.5}.stack{display:grid;gap:8px}.details{margin-top:16px;border-top:1px solid var(--line)}details{border-bottom:1px solid var(--line);padding:13px 0}summary{cursor:pointer;font-weight:700;font-size:14px}.foot{font-size:11px;color:#655e51;margin-top:28px;line-height:1.45}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#25231e;color:#fff8e8;border-radius:28px;box-shadow:0 5px 18px #0004;z-index:5;white-space:nowrap}.switcher button{color:inherit;background:transparent;border:0;min-width:46px;min-height:46px;font-size:20px}.switcher span{min-width:164px;text-align:center;font-size:11px;font-weight:700}.status{font-size:11px;font-weight:700}.map{width:100%;height:auto;border:1px solid var(--line);display:block}.mapwrap{overflow:auto}.mapwrap img{min-width:100%}label{font-size:12px;font-weight:700}select{font:inherit;padding:9px;max-width:100%;background:#fffaf0;border:1px solid #928873}a{color:#843523}.variant-b{--paper:#e9ede0;--hot:#304d3b;--line:#a8b3a1}.variant-b h1{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:-2px}.variant-b .intro{background:#d4ddc9;padding:22px 16px;margin:16px -18px 0}.variant-b .row{align-items:start}.variant-b .list{border-top:0}.variant-b .rowmain{display:grid;grid-template-columns:65px 1fr;column-gap:12px}.variant-b .rowmain > .meta:first-child{grid-column:1;grid-row:1/3}.variant-b .rowmain h3{grid-column:2;grid-row:1;margin:0}.variant-b .rowmain > .meta:nth-child(3){grid-column:2;grid-row:2}.variant-b .rowmain > .controls,.variant-b .rowmain > p{grid-column:1 / -1}.variant-c{--paper:#f6e7d4;--hot:#862c3d;--line:#cbaea1}.variant-c .top{border-bottom:0}.variant-c .intro{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);grid-template-columns:1fr 1fr;align-items:end}.variant-c .intro h1{font-style:italic}.variant-c .intro .lead{grid-column:2}.variant-c .list{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:0}.variant-c .plan-list{grid-template-columns:1fr}.variant-c .row{border:1px solid var(--ink);padding:12px;min-height:145px;align-items:end;flex-direction:column}.variant-c .rowmain{width:100%}.variant-c .row h3{font-family:Georgia,serif;font-size:20px}.variant-c .save{align-self:end}.screenreader{position:absolute;left:-10000px}.back{margin-top:18px}.flow{display:grid;grid-template-columns: 1fr auto;align-items:center;gap:8px}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}
</style></head><body><main id="app"></main><script>
/* Three structural proposals for review: list, timeline and poster. All information below is invented to demonstrate the interaction, not event data. */
const examples=[{id:'glass',name:'Glass Harbor',time:'2:30–3:15 PM',stage:'North stage',t:150},{id:'static',name:'Static Bloom',time:'3:00–3:45 PM',stage:'South stage',t:180},{id:'weather',name:'Weather Radio',time:'Time TBA',stage:'Stage TBA',t:null},{id:'glass2',name:'Glass Harbor · acoustic',time:'5:00–5:30 PM',stage:'Stage TBA',t:300}];
const state={tab:'lineup',variant:new URLSearchParams(location.search).get('variant')||'A',saved:new Set(),attendance:{},partial:{},priority:{},undo:null,lastCheck:'Oct 31, 5 PM',knownNewer:true,planScroll:0,updated:false,preview:false,personal:true,activeValue:'personal',conflictChoice:'',download:'failed',online:false,shownGuide:false,back:'plan',mapMode:'reference',mockMap:false,focus:'',notice:''};
if(!['A','B','C'].includes(state.variant)) state.variant='A';
const $=s=>document.querySelector(s), safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const displayTime=a=>a.id==='glass'?(state.updated&&state.activeValue==='published'?'2:45–3:30 PM · example published':'2:35–3:15 PM · personal edit'):a.time;
const bounds=a=>a.id==='glass'?(state.updated&&state.activeValue==='published'?[885,930]:[875,915]):a.id==='static'?[900,945]:a.id==='glass2'?[1020,1050]:null;
const fromClock=x=>{if(!/^\d{2}:\d{2}$/.test(x||''))return null;let [h,m]=x.split(':').map(Number);return h*60+m};
const toClock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function activeInterval(a){let full=bounds(a), choice=state.attendance[a.id]||'';if(choice==='none')return {excluded:true};if(!full)return {unknown:true};if(choice!=='part')return {start:full[0],end:full[1],undecided:!choice};let q=state.partial[a.id]||{},start=fromClock(q.start),end=fromClock(q.end);if(start===null||end===null||start>=end||start<full[0]||end>full[1])return {invalid:true};return {start,end}}
function snapshot(){state.undo={saved:[...state.saved],attendance:structuredClone(state.attendance),partial:structuredClone(state.partial),priority:structuredClone(state.priority),updated:state.updated,activeValue:state.activeValue,knownNewer:state.knownNewer,conflictChoice:state.conflictChoice}}
function undo(){let u=state.undo;if(!u)return;state.saved=new Set(u.saved);state.attendance=u.attendance;state.partial=u.partial;state.priority=u.priority;state.updated=u.updated;state.activeValue=u.activeValue;state.knownNewer=u.knownNewer;state.conflictChoice=u.conflictChoice;state.undo=null;state.notice='Last personal change undone.'}
function resetScenario(name){state.saved=new Set();state.attendance={};state.partial={};state.priority={};state.undo=null;state.updated=false;state.activeValue='personal';state.conflictChoice='';state.online=false;state.download='failed';state.lastCheck='Oct 31, 5 PM';state.knownNewer=true;state.mockMap=false;state.focus='';state.shownGuide=true;state.notice='Example scenario loaded; no real data was changed.';if(name==='reset'){state.tab='lineup';state.shownGuide=false}else if(name==='clash'){state.saved=new Set(['glass','static','weather']);state.tab='plan'}else if(name==='update'){state.saved=new Set(['glass','static']);state.priority.glass='Must see';state.tab='updates'}else if(name==='failure'){state.tab='ready'}else if(name==='map-ref'){state.saved=new Set(['glass']);state.back='plan';state.tab='map'}else if(name==='map-verified'){state.saved=new Set(['glass']);state.mockMap=true;state.tab='plan'}}
const btn=(label,action,cls='',data='')=>`<button class="button ${cls}" data-action="${action}" ${data}>${label}</button>`;
function row(a){let checked=state.saved.has(a.id), time=displayTime(a);return `<article class="row"><div class="rowmain"><div class="meta">${safe(time)}<br>${safe(a.stage)}</div><h3>${safe(a.name)}</h3><div class="meta">${a.t===null?'Not yet checkable':state.updated&&a.id==='glass'?'Updated · needs review':'Example appearance'}</div></div><button class="save ${checked?'on':''}" data-action="save" data-id="${a.id}" aria-label="${checked?'Remove interest in':'Save interest in'} ${safe(a.name)}" aria-pressed="${checked}">${checked?'★':'☆'}</button></article>`}
function lineUp(){const intro=state.variant==='A'?`<div><div class="eyebrow">Saturday · fictional demo</div><h1>Find your<br>people.</h1></div><p class="lead">Pick what you want to see. You can decide what to attend later.</p>`:state.variant==='B'?`<div><div class="eyebrow">Saturday · November 14 · example</div><h1>The day<br>in order.</h1></div><p class="lead">Follow the timetable, then star the appearances you care about.</p>`:`<div><div class="eyebrow">Lineup / example edition</div><h1>Make it<br>yours.</h1></div><p class="lead">Collect your picks. Each appearance is its own tile.</p>`;return `<div class="intro">${intro}</div><div class="flow sectionhead"><div><h2>${state.variant==='B'?'Saturday timeline':state.variant==='C'?'Pick from the bill':'The lineup'}</h2><p class="tiny">${state.saved.size} saved · tap a star to save</p></div>${btn('My plan →','plan','primary')}</div><div class="list">${examples.map(row).join('')}</div>${state.saved.size&&!state.shownGuide?`<div class="notice good"><strong>Saved in this demo</strong>Want to prepare for festival day? No installation required to keep exploring.<div class="controls">${btn('See preparation','ready')}${btn('Not now','dismiss')}</div></div>`:''}<div class="details"><details><summary>Explore more options</summary><p class="tiny">In the full app: search, day and stage filters, editing and personal backup. These are scope reminders, not working controls in this demo.</p></details></div>`}
function plan(){let saved=examples.filter(a=>state.saved.has(a.id));let entries=saved.map(a=>({a,interval:activeInterval(a)}));let pairs=[];for(let i=0;i<entries.length;i++)for(let j=i+1;j<entries.length;j++){let x=entries[i],y=entries[j];if(x.interval.start!==undefined&&y.interval.start!==undefined&&x.interval.start<y.interval.end&&y.interval.start<x.interval.end)pairs.push([x,y])}let unknown=entries.filter(e=>e.interval.unknown||e.interval.invalid);let now=entries.filter(e=>e.interval.start!==undefined&&e.interval.start<=905&&e.interval.end>905);let later=entries.filter(e=>e.interval.start!==undefined&&e.interval.start>905).sort((a,b)=>a.interval.start-b.interval.start);return `<div class="intro"><div class="eyebrow">Your day · example</div><h1>My plan</h1><p class="lead">Your interest stays saved, even if you choose not to attend a set.</p></div>${saved.length?`<div class="box"><div class="eyebrow">Now / next · example clock 3:05 PM</div><h3>${safe(now.map(e=>e.a.name).join(' + ')||'No known saved set now')}</h3><p>${later.length?'Next: '+safe(later[0].a.name)+' at '+toClock(later[0].interval.start)+'.':'No later saved set with a known time in this example.'} ${unknown.length?'Some choices cannot yet be placed.':''}</p><p class="tiny">Undecided interests are shown provisionally; a choice of none is excluded.</p></div>`:''}${saved.length?'':`<div class="notice"><strong>Nothing saved yet</strong>Star an artist on the lineup to start your plan.<div class="controls">${btn('Browse lineup','lineup','primary')}</div></div>`}${pairs.map(([x,y])=>`<div class="notice alert"><strong>Clash: ${safe(x.a.name)} + ${safe(y.a.name)}</strong>These ${x.interval.undecided||y.interval.undecided?'potential attendance windows':'attendance choices'} overlap. Choose all, part, or none; both interests remain saved. Travel time cannot be checked from this map.</div>`).join('')}${unknown.length?`<div class="notice"><strong>Not all clashes can be checked</strong>${safe(unknown.map(e=>e.a.name).join(', '))}: ${unknown.some(e=>e.interval.invalid)?'a partial interval is missing or outside the set; review it. ':'time is unknown. '}No conflict-free claim is possible for these choices.</div>`:''}${state.undo?`<div class="controls">${btn('Undo last change','undo')}</div>`:''}<div class="list plan-list">${saved.map(a=>{let full=bounds(a),choice=state.attendance[a.id]||'',part=state.partial[a.id]||{},interval=activeInterval(a);return `<article class="row"><div class="rowmain"><div class="meta">${safe(displayTime(a))}${a.id==='glass'&&state.updated?' · updated':''}</div><h3>${safe(a.name)}</h3><div class="meta">${safe(a.stage)}${a.id==='glass'&&state.updated?' · Needs review':''}</div><div class="controls"><label>Priority <select data-priority="${a.id}" aria-label="Priority for ${safe(a.name)}"><option ${!state.priority[a.id]?'selected':''} value="">Interested</option><option ${state.priority[a.id]==='Must see'?'selected':''} value="Must see">Must see</option><option ${state.priority[a.id]==='Maybe'?'selected':''} value="Maybe">Maybe</option></select></label><label>Attend <select data-attendance="${a.id}" aria-label="Attendance for ${safe(a.name)}"><option ${!choice?'selected':''} value="">Undecided</option><option ${choice==='all'?'selected':''} value="all">All</option><option ${choice==='part'?'selected':''} value="part">Part</option><option ${choice==='none'?'selected':''} value="none">None</option></select></label>${btn('Find stage','stage','','data-id="'+a.id+'"')}</div>${choice==='part'?`<div class="controls"><label>From <input type="time" data-part="start" data-id="${a.id}" value="${safe(part.start||'')}"></label><label>To <input type="time" data-part="end" data-id="${a.id}" value="${safe(part.end||'')}"></label></div><p class="tiny">${!full?'Set time is unknown; a partial interval cannot be checked.':interval.invalid?'Choose an interval within '+toClock(full[0])+'–'+toClock(full[1])+'.':'Partial attendance selected.'}</p>`:''}</div><button class="save on" data-action="save" data-id="${a.id}" aria-label="Remove interest in ${safe(a.name)}">★</button></article>`}).join('')}</div><div class="details"><details><summary>Plan tools &amp; friends</summary><p class="tiny">In the full app: edit times, import/export a personal backup, compare friend plans, arrange meetups, planned positions and dated manual check-ins. Planned positions and check-ins are not live location. These controls are not implemented here.</p></details></div>`}

CDeKv+fJ/wDvpP8A4qgDk6K6z/hBvFX/AD5P/wB9J/8AFUf8IN4q/wCfJ/8AvpP/AIqgDk6K6z/hBvFX/Pk//fSf/FUf8IN4q/58n/76T/4qgDk6K6z/AIQbxV/z5P8A99J/8VR/wg3ir/nyf/vpP/iqAOTorrP+EG8Vf8+T/wDfSf8AxVH/AAg3ir/nyf8A76T/AOKoA5Oius/4QbxV/wA+T/8AfSf/ABVH/CDeKv8Anyf/AL6T/wCKoA5OiusPgfxX/wA+T/8AfSf/ABVR/wDCGeIY+bqFYR3aSRFA+vJoA5f29a6HQtJS6LanqHyWVthpGPG4joi+pNWk07QdMJfVboXTD/lhaZOfYucD8qzdW1qfVCkAVYbeLiKBOFX6+p9zQBX1fUZ9V1CS+b5dxwqn+FRwo/AVm5l9R+VLRQB//9k=" alt="User-supplied venue map screenshot, unverified reference only"></div><p class="tiny">Zoom using your browser or phone. Labels and features in the image are unverified; a missing icon does not prove an amenity is absent.</p><div class="controls">${btn('← Back to '+(state.back==='plan'?'My plan':'lineup'),'back','primary')}</div><div class="controls">${btn(state.mockMap?'Illustrative verified map ON':'Try illustrative verified map','mockmap')}</div><p class="tiny">This test uses a fictional diagram. Return to My plan and tap Find stage on a timed example; unknown stages remain unknown.</p><div class="details"><details><summary>How a verified stage shortcut could work</summary><p class="tiny">When a future map revision and its stage position are verified and compatible, a timed set can open directly to that stage. This reference cannot demonstrate a real verified pin.</p></details><details><summary>Map tools retained for the full app</summary><p class="tiny">Stage and amenity views, map controls, friend planned positions and dated manual check-ins remain in scope. Their details are not simulated here.</p></details></div>`}
function ready(){return `<div class="intro"><div class="eyebrow">Preparation · simulated</div><h1>Ready when<br>you are?</h1><p class="lead">This screen shows an example state. This prototype does not download anything or work as an offline app.</p></div><div class="notice ${state.online?'good':'alert'}"><strong>${state.online?'Simulated connection available':'Simulated offline'}</strong>${state.online?'You can try the example download again.':(state.knownNewer?'A newer example revision was previously observed. ':'')+'Newer information cannot be checked while offline. A first download requires connection or a supported transfer.'}<div class="controls">${btn(state.online?'Simulate going offline':'Simulate connection','connection')}</div></div><div class="stack"><div class="box"><div class="flow"><h3>App shell</h3><span class="status">Example saved</span></div><p>Demo version 1. No real offline cold-start has been tested.</p></div><div class="box"><div class="flow"><h3>Timetable</h3><span class="status">Example revision ${state.updated?'2':'1'}</span></div><p>Partial · some times unknown. Source checked: example ${state.updated?'Nov 1, 10 AM':'Oct 31, 4 PM'}. Last update check: example ${state.lastCheck}. ${state.knownNewer?'A newer example revision is known.':''}</p><div class="controls">${btn('Review example update','updates')}${btn('Simulate successful update check','check','',state.online?'':'disabled')}</div></div><div class="box"><div class="flow"><h3>Map</h3><span class="status">${state.download==='failed'?'Download failed':'Example saved'}</span></div><p>${state.download==='failed'?'The example map download did not finish. A previous usable map is not assumed.':'The simulated download completed. The reference is still unverified.'}</p><div class="controls">${btn('Try download again','download','',state.online?'':'disabled')}</div></div></div><details><summary>Install for easier access</summary><p class="tiny">Open the link in Safari on iPhone or Chrome on Android, add it to your Home Screen, reopen it online, then prepare its content. Menus vary. On iPhone, Safari and the Home Screen app may have separate storage: use personal backup/export and import to carry your plan, then prepare again. Installation alone does not download everything.</p></details>`}
function updates(){return `<div class="intro"><div class="eyebrow">Updates · example only</div><h1>Review changes</h1><p class="lead">Checking does not replace your active timetable. These invented changes illustrate the decision.</p></div><div class="box"><h3>Example revision 2</h3><p>The published Glass Harbor time moves from 2:30 to 2:45 PM; your active personal edit is 2:35–3:15 PM. Your saved interests stay put; its attendance needs review. This is a simulation, not verified event information.</p></div>${state.personal?`<div class="notice"><strong>Your personal edit differs</strong>Personal 2:35–3:15 PM · Example published 2:45–3:30 PM. Choose which to use before applying; the personal value remains labelled personal if kept.<div class="controls">${btn('Use published value','published',state.conflictChoice==='published'?'primary':'')}${btn('Keep my edit','personal',state.conflictChoice==='personal'?'primary':'')}</div>${state.conflictChoice?`<p>Selected: ${state.conflictChoice==='published'?'example published value':'personal edit'}.</p>`:''}</div>`:''}<p class="tiny">Applying preserves interests and attendance. In the full app it also preserves other personal and friend data; uncertain matches require review.</p><div class="controls">${btn(state.updated?'Example update applied':'Apply example update','apply','red',state.updated||!state.conflictChoice?'disabled':'')}${btn('Keep current revision','ready')}</div>${state.updated?'<div class="notice good"><strong>Example update applied</strong>Glass Harbor needs review. Your selections remain in My plan.</div>':''}<hr class="divider"><details><summary>Import or restore</summary><p class="tiny">The full app will preview schedule codes and files, identify the event and publisher verification, reject invalid or wrong-event data, and make restoring an older revision explicit. Imports are not functional in this demo.</p></details>`}
function render(){const body=state.tab==='lineup'?lineUp():state.tab==='plan'?plan():state.tab==='map'?map():state.tab==='ready'?ready():updates();const nav=[['lineup','Lineup'],['plan','My plan'],['map','Map'],['ready','Offline']];$('#app').innerHTML=`<div class="shell variant-${state.variant.toLowerCase()}"><div class="prototype"><strong>REVIEW PROTOTYPE</strong> · Fictional acts, times &amp; states. Nothing is downloaded or saved after refresh.<details><summary>Reviewer scenarios · reset demo</summary><p>Load a scenario to inspect it; this panel is not part of the proposed app.</p><div class="controls"><button data-action="scenario" data-scenario="reset">Fresh start</button><button data-action="scenario" data-scenario="clash">Clash + unknown</button><button data-action="scenario" data-scenario="update">Update + edit</button><button data-action="scenario" data-scenario="failure">Offline failure</button><button data-action="scenario" data-scenario="map-ref">Unverified map</button><button data-action="scenario" data-scenario="map-verified">Illustrative verified map</button></div><p>For the last scenario, tap Find stage in My plan. Switching scenarios resets demo choices.</p></details></div><header class="top"><div class="brand">ORLANDO<br>FIELD GUIDE<small>WEEKEND COMPANION</small></div><div class="day">NOV 14—15<br>2026</div></header><nav class="nav" aria-label="Main">${nav.map(([id,label])=>`<button data-action="${id}" ${state.tab===id?'aria-current="page"':''}>${label}${id==='plan'&&state.saved.size?' · '+state.saved.size:''}</button>`).join('')}</nav>${state.notice?`<div class="notice" role="status">${safe(state.notice)}</div>`:''}${body}<p class="foot">Design proposals for discussion. No accounts, real timetable, verification, storage, GPS, installation, or offline behavior is implemented.</p></div><div class="switcher" aria-label="Compare proposed designs"><button data-action="previous" aria-label="Previous design">←</button><span>${state.variant} · ${{A:'Lineup list',B:'Day timeline',C:'Festival poster'}[state.variant]}</span><button data-action="next" aria-label="Next design">→</button></div>`}
function variant(n){const v=['A','B','C'];state.variant=v[(v.indexOf(state.variant)+n+3)%3];let u=new URL(location.href);u.searchParams.set('variant',state.variant);history.replaceState(null,'',u);render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action;state.notice='';if(a==='previous'||a==='next'){variant(a==='previous'?-1:1);return}if(['lineup','plan','map','ready','updates'].includes(a)){if(a==='map')state.back=state.tab==='plan'?'plan':'lineup';state.tab=a;if(a==='map')state.focus=''}else if(a==='back'){state.tab=state.back}else if(a==='stage'){state.planScroll=window.scrollY;state.back=state.tab;state.tab='map';let item=examples.find(x=>x.id===b.dataset.id);state.focus=state.mockMap&&item.stage!=='Stage TBA'?item.id:''}else if(a==='mockmap'){state.mockMap=!state.mockMap;state.notice=state.mockMap?'Illustrative verified-map scenario enabled. This does not verify the supplied screenshot.':'Illustrative map scenario turned off.'}else if(a==='reference'){state.focus=''}else if(a==='scenario'){resetScenario(b.dataset.scenario)}else if(a==='undo'){undo()}else if(a==='check'){state.lastCheck='Nov 1, 11 AM';state.knownNewer=!state.updated;state.notice=state.knownNewer?'Example check succeeded: revision 2 is available. The active revision did not change.':'Example check succeeded: no newer revision was found.'}else if(a==='save'){snapshot();state.saved.has(b.dataset.id)?state.saved.delete(b.dataset.id):state.saved.add(b.dataset.id)}else if(a==='dismiss'){state.shownGuide=true}else if(a==='connection'){state.online=!state.online}else if(a==='download'){state.download='saved';state.notice='Example download complete; this did not save a real map.'}else if(a==='published'||a==='personal'){state.conflictChoice=a}else if(a==='apply'){snapshot();state.updated=true;state.activeValue=state.conflictChoice;state.knownNewer=false;state.notice='Example update applied. Saved interests and attendance remain.'}render();if(a==='back'&&state.tab==='plan')window.scrollTo(0,state.planScroll);else if(['lineup','plan','map','ready','updates','stage','back','scenario'].includes(a))window.scrollTo(0,0)});
document.addEventListener('change',e=>{let t=e.target,id=t.dataset.attendance||t.dataset.priority||t.dataset.id;if(t.dataset.attendance){snapshot();state.attendance[id]=t.value;if(t.value==='part'&&!state.partial[id]){let full=bounds(examples.find(a=>a.id===id));state.partial[id]=full?{start:toClock(full[0]),end:toClock(full[1])}:{start:'',end:''}}render()}else if(t.dataset.priority){snapshot();state.priority[id]=t.value;render()}else if(t.dataset.part){snapshot();state.partial[id]={...(state.partial[id]||{}),[t.dataset.part]:t.value};render()}});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();variant(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
